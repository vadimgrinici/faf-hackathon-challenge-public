services:
  hotel-db:
    image: postgres:16
    environment:
      POSTGRES_USER: hotel
      POSTGRES_PASSWORD: hotel
      POSTGRES_DB: hotel
    ports:
      - "5433:5432"

  beach-db:
    image: postgres:16
    environment:
      POSTGRES_USER: beach
      POSTGRES_PASSWORD: beach
      POSTGRES_DB: beach
    ports:
      - "5434:5432"

  airport:
    build: ./services/airport
    ports:
      - "3001:3001"
    environment:
      - PORT=3001
      - BROADCAST_SERVICE_URL=http://broadcast:3002
      - INTERNAL_SECRET=airport-token
      - SIMULATION_START_TIME=2026-06-20T00:00:00Z
      - GAME_SPEED=300
      - EU_GATES=3
      - ALL_GATES=2
      - PROCESSING_TIME_EU=300
      - PROCESSING_TIME_ALL=600

  hotel:
    build: ./services/hotel
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=postgresql://hotel:hotel@hotel-db:5432/hotel
      - SIMULATION_START_TIME=2026-06-20T00:00:00Z
      - GAME_SPEED=300
    depends_on:
      - hotel-db

  beach:
    build: ./services/beach
    ports:
      - "8080:8080"
    environment:
      - APP_PORT=8080
      - JDBC_URL=jdbc:postgresql://beach-db:5432/beach
      - DB_USER=beach
      - DB_PASSWORD=beach
    depends_on:
      - beach-db

  broadcast:
    build: ./services/broadcast
    ports:
      - "3002:3002"
    environment:
      - AIRPORT_TOKEN=airport-token
      - HOTEL_TOKEN=hotel-token
      - BEACH_TOKEN=beach-token
      - PARROT_TOKEN=parrot-token
      - FE_TOKEN=fe-token

  parrot:
    build: ./services/parrot
    ports:
      - "3003:3003"
    environment:
      - LLM_MODEL=meta-llama/llama-3.1-8b-instruct

  parrot-b:
    build: ./services/parrot
    ports:
      - "3004:3003"
    environment:
      - LLM_MODEL=meta-llama/llama-3.1-8b-instruct

  gateway:
    build: ./gateway
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - AIRPORT_SERVICE_URL=http://airport:3001
      - HOTEL_SERVICE_URL=http://hotel:3000
      - BEACH_SERVICE_URL=http://beach:8080
      - BROADCAST_SERVICE_URL=http://broadcast:3002
      - PARROT_SERVICE_URL=http://parrot:3003,http://parrot-b:3003
      - CORS_ALLOWED_ORIGINS=http://localhost:5173
      - GATEWAY_RATE_LIMIT=0
      - ADMIN_PASSCODE=pirate-23-coconut
    depends_on:
      - airport
      - hotel
      - beach
      - broadcast
      - parrot
      - parrot-b

  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    environment:
    - VITE_GATEWAY_URL=http://localhost:8000
    - VITE_MOCK=false
    - VITE_TRAFFIC_GENERATOR=off
    - VITE_SIMULATION_START_TIME=2026-06-20T00:00:00Z
    - VITE_GAME_SPEED=300
    - VITE_ADMIN_PASSCODE=pirate-23-coconut
    depends_on:
      - gateway